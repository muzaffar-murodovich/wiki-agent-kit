[project]
name = "wikikit"
version = "0.1.0"
description = "Read-only agentic toolkit for Wikimedians: translate articles between wikis with markup intact, find missing articles, draft Wikidata statements, verify citations. Claude Code plugin + MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Muzaffar Murodovich" }]
dependencies = [
    "mwparserfromhell==0.7.2",
    "certifi>=2024.2.2",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wikikit = "wikikit.cli:main"
wikikit-mcp = "wikikit.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikikit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
